title: "Michelle Faits"
description: "Notes on biology, data science, and building useful tools."
url: "https://mfaits.github.io"

remote_theme: "mmistakes/minimal-mistakes@4.28.0"

plugins:
  - jekyll-feed
  - jekyll-include-cache

author:
  name: "Michelle Faits"
  bio: "Data Science · AI Engineering · Pharma · Biology"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/mfaits"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/michelle-faits/"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post_with_subscribe
      author_profile: true
      classes: wide
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

masthead_title: "Michelle Faits"
search: true
